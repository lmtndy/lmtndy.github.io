<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Lam Tan Duy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --paper: #f1f3f6; --ink: #141a24; --muted: #586274; --box: #c8235f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #0e1218; --ink: #e5e9ef; --muted: #96a0b1; --box: #ff6596; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
  font: 400 1rem/1.6 "IBM Plex Sans", "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
.det { position: relative; border: 2px solid var(--box); padding: 1.5rem 2rem; max-width: 26rem; }
.det span { position: absolute; left: -2px; bottom: 100%; background: var(--box); color: var(--paper);
  font: 500 0.75rem/1 ui-monospace, Menlo, monospace; padding: 0.35em 0.55em; }
h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
p { margin: 0; color: var(--muted); }
a { color: var(--ink); text-decoration-color: var(--box); }
</style>
</head>

<div class="det">
  <span>no_detection 0.00</span>
  <h1>Page not found</h1>

</div>
